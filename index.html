<!doctype html>
<html lang="sv">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#ffffff">
		<title>Martin, at 50</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
		<style>
			:root {
				color-scheme: light;
				--paper: #ffffff;
				--ink: #202020;
				--muted: #777777;
				--line: #e8e8e8;
				--tile: #e7e7e7;
				--sans: "DM Sans", sans-serif;
				--serif: "Playfair Display", Georgia, serif;
			}

			* { box-sizing: border-box; }

			body {
				margin: 0;
				background: var(--paper);
				color: var(--ink);
				font-family: var(--sans);
				-webkit-font-smoothing: antialiased;
			}

			button, textarea { font: inherit; }

			.topbar {
				height: 58px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 clamp(18px, 4vw, 38px);
				border-bottom: 1px solid var(--line);
			}

			.answer-form {
				position: relative;
				display: grid;
				grid-template-columns: auto auto;
				align-items: center;
				gap: 2px 6px;
			}

			.answer-drag-area {
				position: relative;
				width: clamp(86px, 18vw, 150px);
				height: 34px;
			}

			.answer-reveal {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				overflow: hidden;
				color: var(--ink);
				font-size: 12px;
				white-space: nowrap;
			}

			.answer-input {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 34px;
				padding: 0 10px;
				border: 1px solid var(--line);
				border-radius: 2px;
				outline: none;
				background: #ffffff;
				color: var(--ink);
				font-size: 13px;
				touch-action: auto;
				transition: transform .28s cubic-bezier(.2, .75, .25, 1);
			}

			.answer-input:focus { border-color: #777777; }
			.answer-input.is-draggable { cursor: grab; touch-action: none; }
			.answer-input.is-grabbing { cursor: grabbing; }
			.answer-input.is-draggable.is-text-cursor { cursor: text; }
			.answer-input.is-dragging { transition: none; }

			.answer-error {
				grid-column: 1 / -1;
				margin: 0;
				color: #c62828;
				font-size: 11px;
				line-height: 14px;
			}

			.answer-error[hidden] { display: none; }

			.submit-button {
				height: 34px;
				padding: 0 12px;
				border: 1px solid var(--ink);
				border-radius: 2px;
				background: var(--ink);
				color: #ffffff;
				cursor: pointer;
				font-size: 12px;
			}

			.submit-button:hover { background: #444444; }

			.notes-button {
				display: inline-flex;
				align-items: center;
				gap: 9px;
				padding: 10px 13px;
				border: 0;
				border-radius: 3px;
				background: transparent;
				color: var(--ink);
				cursor: pointer;
				font-size: 13px;
				transition: background .2s;
			}

			.topbar-actions {
				display: flex;
				align-items: center;
				gap: 4px;
			}

			.puzzle2-button[hidden] { display: none; }

			.notes-button:hover { background: #f2f2f2; }
			.notes-button svg { width: 16px; height: 16px; }

			main {
				width: min(100%, 1040px);
				height: calc(100svh - 58px);
				margin: 0 auto;
				padding: 8px 22px 18px;
				display: grid;
				grid-template-rows: auto minmax(0, 1fr);
				gap: 10px;
			}

			.intro { margin: 0; text-align: center; }

			h1 {
				margin: 0;
				font-family: var(--serif);
				font-size: 48px;
				font-weight: 500;
				line-height: 1.1;
			}

			.gallery {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				grid-template-rows: repeat(3, minmax(0, 1fr));
				gap: 10px;
				width: min(100%, 980px, calc((100svh - 150px) * 1.1));
				aspect-ratio: 1.1;
				align-self: center;
				justify-self: center;
			}

			.tile {
				position: relative;
				overflow: hidden;
				perspective: 1000px;
				border: 1px solid #e1e1e1;
				border-radius: 0;
				background: var(--tile);
			}

			.tile-inner {
				position: absolute;
				inset: 0;
				transform-style: preserve-3d;
				transition: transform .75s cubic-bezier(.2, .7, .2, 1);
			}

			.tile.is-flipped .tile-inner { transform: rotateY(180deg); }

			.tile-face {
				position: absolute;
				inset: 0;
				overflow: hidden;
				backface-visibility: hidden;
				-webkit-backface-visibility: hidden;
			}

			.tile-front { background: var(--tile); }
			.tile-back { transform: rotateY(180deg); }

			.tile-clue-label {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				padding: 8px;
				background: #d5d5d5;
				color: var(--ink);
				font-size: clamp(10px, 1.8vw, 16px);
				text-align: center;
				visibility: hidden;
			}

			.tile.is-clue .tile-clue-label { visibility: visible; }

			.tile-clue {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				padding: 8px;
				color: var(--tile);
				font-size: clamp(10px, 1.8vw, 16px);
				text-align: center;
			}

			.tile-photo {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
			}

			.status {
				position: fixed;
				bottom: 7px;
				left: 12px;
				right: 12px;
				color: var(--muted);
				font-size: 11px;
				text-align: center;
			}

			.scrim {
				position: fixed;
				z-index: 5;
				inset: 0;
				background: rgba(24, 31, 27, .28);
				opacity: 0;
				pointer-events: none;
				transition: opacity .25s ease;
			}

			.scrim.is-open { opacity: 1; pointer-events: auto; }

			.notes-panel {
				position: fixed;
				z-index: 6;
				top: 0;
				right: 0;
				bottom: 0;
				display: flex;
				width: min(440px, 100%);
				flex-direction: column;
				background: #ffffff;
				box-shadow: -12px 0 40px rgba(27, 34, 29, .12);
				transform: translateX(102%);
				transition: transform .32s cubic-bezier(.2, .75, .25, 1);
			}

			.notes-panel.is-open { transform: translateX(0); }

			.notes-header {
				display: flex;
				min-height: 74px;
				align-items: center;
				justify-content: space-between;
				padding: 0 24px;
				border-bottom: 1px solid var(--line);
			}

			.notes-heading {
				margin: 0;
				font-family: var(--serif);
				font-size: 24px;
				font-weight: 500;
			}

			.close-button {
				display: grid;
				width: 34px;
				height: 34px;
				place-items: center;
				border: 0;
				border-radius: 50%;
				background: transparent;
				color: var(--muted);
				cursor: pointer;
			}

			.close-button:hover { background: #f2f2f2; color: var(--ink); }
			.close-button svg { width: 18px; height: 18px; }

			.note-input {
				width: 100%;
				min-height: 0;
				flex: 1;
				resize: none;
				padding: 25px 26px;
				border: 0;
				outline: none;
				background: transparent;
				color: #252a26;
				font-family: var(--sans);
				font-size: 15px;
				line-height: 1.8;
			}

			.note-input::placeholder { color: #a2a59e; }

			.notes-footer {
				display: flex;
				min-height: 45px;
				align-items: center;
				justify-content: space-between;
				padding: 0 25px;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 11px;
			}

			.save-state { display: inline-flex; align-items: center; gap: 7px; }
			.save-dot { width: 6px; height: 6px; border-radius: 50%; background: #a3a79f; }
			.save-dot.is-saved { background: #333333; }

			@media (max-width: 620px) {
				.topbar { height: 54px; padding: 0 12px; }
				main { height: calc(100svh - 54px); padding: 6px 16px 14px; gap: 8px; }
				h1 { font-size: 38px; }
				.gallery { width: min(100%, calc((100svh - 140px) * 1.1)); gap: 6px; }
				.notes-header { min-height: 66px; padding: 0 20px; }
				.note-input { padding: 21px 20px; }
			}

			@media (prefers-reduced-motion: reduce) {
				*, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
				.tile-inner { transition-duration: .75s !important; }
			}
		</style>
	</head>
	<body>
		<header class="topbar">
			<form class="answer-form" id="answer-form">
				<div class="answer-drag-area">
					<span class="answer-reveal" aria-hidden="true">Nämen hejsan</span>
					<input class="answer-input" id="answer-input" type="text" placeholder="Svar" aria-label="Svar på bild" autocomplete="off">
				</div>
				<button class="submit-button" type="submit">Skicka</button>
				<p class="answer-error" id="answer-error" role="status" aria-live="polite" hidden>Fel svar.</p>
			</form>
			<div class="topbar-actions">
				<a class="notes-button puzzle2-button" id="puzzle2-link" href="puzzle2.html" hidden>Pussel 2</a>
				<a class="notes-button puzzle2-button" id="crosswords-link" href="crossword.html" hidden>Pussel 3</a>
				<a class="notes-button puzzle2-button" id="lorem-link" href="lorem.html" hidden>Finalen</a>
				<button class="notes-button" id="open-notes" type="button" aria-controls="notes-panel" aria-expanded="false">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l4 4v14H4V3h4Z"/><path d="M8 3v5h8V3M8 13h8M8 17h5"/></svg>
					<span>Anteckningar</span>
				</button>
			</div>
		</header>

		<main>
			<section class="intro" aria-labelledby="page-title">
				<h1 id="page-title">Martin, at 50</h1>
			</section>

			<section class="gallery" id="gallery" aria-label="Fotogalleri"></section>
			<p class="status" id="connection-status" role="status" aria-live="polite"></p>
		</main>

		<div class="scrim" id="scrim"></div>
		<aside class="notes-panel" id="notes-panel" aria-label="Anteckningar" aria-hidden="true">
			<div class="notes-header">
				<h2 class="notes-heading">Anteckningar</h2>
				<button class="close-button" id="close-notes" type="button" aria-label="Stäng anteckningar">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
				</button>
			</div>
			<textarea class="note-input" id="note-input" placeholder="Skriv något…" aria-label="Anteckningstext"></textarea>
			<div class="notes-footer">
				<span>Ren text</span>
				<span class="save-state"><span class="save-dot" id="save-dot"></span><span id="save-label">Ansluter</span></span>
			</div>
		</aside>

		<script type="module">
			import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
			import { getDatabase, onValue, ref, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

			const firebaseConfig = {
				apiKey: "AIzaSyCITRSkY1K9JsP1ALD2ge_LQ2CEHDnGvlc",
				authDomain: "martinfyller50.firebaseapp.com",
				databaseURL: "https://martinfyller50-default-rtdb.europe-west1.firebasedatabase.app",
				projectId: "martinfyller50",
				storageBucket: "martinfyller50.firebasestorage.app",
				messagingSenderId: "117839040642",
				appId: "1:117839040642:web:dba6a65e8a1e54bffce49b",
				measurementId: "G-8SXWMX1464"
			};

			const photoUrls = [
				"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=85",
				"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=85",
				"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=85",
				"https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=900&q=85",
				"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=85",
				"https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=900&q=85",
				"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=85",
				"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85",
				"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=85"
			];
			const tileAnswers = ["fotograf", "Nämen hejsan", "3", "älska", "eureka", "Awww, du hitta mig :(", "puzzle2", "svårgissat ord", "Martin fyller 50"];
			const crosswordsTileNumber = tileAnswers.indexOf("fotograf") + 1;
			const outerTileNumbers = [1, 2, 3, 4, 6, 7, 8, 9];

			const gallery = document.querySelector("#gallery");
			const pageTitle = document.querySelector("#page-title");
			const status = document.querySelector("#connection-status");
			const answerForm = document.querySelector("#answer-form");
			const answerInput = document.querySelector("#answer-input");
			const answerError = document.querySelector("#answer-error");
			let answerDrag;
			let answerDragEnabled = false;
			let answerCursorTimer;
			const noteInput = document.querySelector("#note-input");
			const saveDot = document.querySelector("#save-dot");
			const saveLabel = document.querySelector("#save-label");
			const notesPanel = document.querySelector("#notes-panel");
			const scrim = document.querySelector("#scrim");
			const openButton = document.querySelector("#open-notes");
			const closeButton = document.querySelector("#close-notes");
			const puzzle2Link = document.querySelector("#puzzle2-link");
			const crosswordsLink = document.querySelector("#crosswords-link");
			const loremLink = document.querySelector("#lorem-link");
			let database;
			let tileStates = {};
			let tile8ClueShown = false;
			let titleTileUnlocked = false;
			let titleSelectionStarted = false;
			let titleRestoreTimer;
			let noteReady = false;
			let noteWriteQueue = Promise.resolve();
			let saveTimer;

			function hasTitleSelection() {
				const selection = window.getSelection();
				if (!selection || selection.isCollapsed || selection.rangeCount === 0 || !selection.toString().trim()) return false;
				return selection.getRangeAt(0).intersectsNode(pageTitle);
			}

			function showMarkedTitle() {
				clearTimeout(titleRestoreTimer);
				pageTitle.textContent = "Martin Fyller 50";
				titleRestoreTimer = setTimeout(() => {
					pageTitle.textContent = "Martin, at 50";
				}, 2000);
			}

			function renderTileStates() {
				document.querySelectorAll(".tile").forEach((tile) => {
					const tileState = tileStates[tile.dataset.tile];
					const solved = tileState === true;
					const clueShown = tile.dataset.tile === "8" && !solved
						&& (tile8ClueShown || tileState === "clue");
					const flipped = solved;
					tile.classList.toggle("is-clue", clueShown);
					tile.classList.toggle("is-flipped", flipped);
					const description = clueShown
						? ", ledtråd visad: svårgissat ord"
						: flipped ? " visat" : ", låst";
					tile.setAttribute("aria-label", `Foto ${tile.dataset.tile}${description}`);
				});
			}

			document.addEventListener("mousedown", (event) => {
				titleSelectionStarted = pageTitle.contains(event.target);
			});

			document.addEventListener("mouseup", () => {
				const shouldCheckTitleSelection = titleSelectionStarted && titleTileUnlocked;
				titleSelectionStarted = false;
				if (!shouldCheckTitleSelection) return;
				requestAnimationFrame(() => {
					if (titleTileUnlocked && hasTitleSelection()) showMarkedTitle();
				});
			});

			for (let index = 0; index < 9; index += 1) {
				const tile = document.createElement("div");
				tile.className = "tile";
				tile.dataset.tile = String(index + 1);
				tile.setAttribute("aria-label", `Foto ${index + 1}, låst`);

				const image = document.createElement("img");
				image.className = "tile-photo";
				image.src = photoUrls[index];
				image.alt = `Foto ${index + 1}`;
				image.loading = "lazy";

				const inner = document.createElement("div");
				inner.className = "tile-inner";
				const front = document.createElement("div");
				front.className = "tile-face tile-front";
				front.setAttribute("aria-hidden", "true");
				if (index === 5) {
					const clue = document.createElement("span");
					clue.className = "tile-clue";
					clue.textContent = "Awww, du hitta mig :(";
					front.append(clue);
				}
				if (index === 7) {
					const clueLabel = document.createElement("span");
					clueLabel.className = "tile-clue-label";
					clueLabel.textContent = "svårgissat ord";
					front.append(clueLabel);
				}
				const back = document.createElement("div");
				back.className = "tile-face tile-back";
				back.append(image);
				inner.append(front, back);
				tile.append(inner);
				gallery.append(tile);

				if (index === 7) {
					tile.addEventListener("dblclick", async () => {
						if (!database || tile.classList.contains("is-flipped")) return;
						try {
							await set(ref(database, "tileClues/8"), true);
						} catch (error) {
							console.error(error);
							status.textContent = "Det gick inte att visa ledtråden. Kontrollera anslutningen och försök igen.";
						}
					});
				}
			}

			const normalizeAnswer = (answer = "") => answer.trim().toLowerCase().replace(/!+$/, "");

			answerForm.addEventListener("submit", async (event) => {
				event.preventDefault();
				const submittedAnswer = normalizeAnswer(answerInput.value);
				const tileIndex = tileAnswers.findIndex((answer) => normalizeAnswer(answer) === submittedAnswer);

				if (tileIndex === -1) {
					answerError.hidden = !submittedAnswer;
					return;
				}

				answerError.hidden = true;
				if (!database) return;

				const tileNumber = tileIndex + 1;
				const tile = gallery.querySelector(`[data-tile="${tileNumber}"]`);
				if (tileNumber === 8) {
					if (!tile.classList.contains("is-clue")) {
						answerError.hidden = false;
						return;
					}
					try {
						await update(ref(database), {
							"tiles/8": true,
							"tileClues/8": false
						});
						answerInput.value = "";
					} catch (error) {
						console.error(error);
						answerError.textContent = "Det gick inte att visa bilden. Försök igen.";
						answerError.hidden = false;
					}
					return;
				}
				if (tile.classList.contains("is-flipped")) return;

				try {
					await set(ref(database, `tiles/${tileNumber}`), true);
					answerInput.value = "";
				} catch (error) {
					console.error(error);
				}
			});

			answerInput.addEventListener("input", () => {
				answerError.textContent = "Fel svar.";
				answerError.hidden = true;
			});

			function showAnswerDragCursor() {
				if (!answerDragEnabled) return;
				clearTimeout(answerCursorTimer);
				answerInput.classList.remove("is-text-cursor");
				answerInput.classList.add("is-grabbing");
				answerCursorTimer = setTimeout(() => {
					answerInput.classList.remove("is-grabbing");
					answerInput.classList.toggle("is-text-cursor", answerDragEnabled);
				}, 50);
			}

			answerInput.addEventListener("pointerenter", (event) => {
				if (event.pointerType !== "touch") showAnswerDragCursor();
			});

			answerInput.addEventListener("pointerdown", (event) => {
				if (!answerDragEnabled || !event.isPrimary || event.button !== 0) return;
				answerDrag = {
					pointerId: event.pointerId,
					startX: event.clientX,
					startY: event.clientY,
					moved: false
				};
				answerInput.setPointerCapture(event.pointerId);
			});

			answerInput.addEventListener("pointermove", (event) => {
				if (!answerDrag || answerDrag.pointerId !== event.pointerId) return;
				const deltaX = event.clientX - answerDrag.startX;
				const deltaY = event.clientY - answerDrag.startY;
				if (!answerDrag.moved && Math.hypot(deltaX, deltaY) < 6) return;

				answerDrag.moved = true;
				event.preventDefault();
				const resistedX = Math.sign(deltaX) * Math.min(Math.abs(deltaX) * .55, 110);
				const resistedY = Math.sign(deltaY) * Math.min(Math.abs(deltaY) * .55, 90);
				answerInput.classList.add("is-dragging");
				answerInput.style.transform = `translate(${resistedX}px, ${resistedY}px)`;
			});

			function returnAnswerInput() {
				if (answerDrag && answerDrag.moved) {
					answerInput.classList.remove("is-dragging");
					answerInput.style.transform = "translate(0, 0)";
				}
				answerDrag = null;
				clearTimeout(answerCursorTimer);
				answerInput.classList.remove("is-grabbing");
				answerInput.classList.toggle("is-text-cursor", answerDragEnabled);
			}

			answerInput.addEventListener("pointerup", returnAnswerInput);
			answerInput.addEventListener("pointercancel", returnAnswerInput);

			function setNotesOpen(isOpen) {
				notesPanel.classList.toggle("is-open", isOpen);
				notesPanel.setAttribute("aria-hidden", String(!isOpen));
				scrim.classList.toggle("is-open", isOpen);
				openButton.setAttribute("aria-expanded", String(isOpen));
				if (isOpen) noteInput.focus();
			}

			openButton.addEventListener("click", () => setNotesOpen(true));
			closeButton.addEventListener("click", () => setNotesOpen(false));
			scrim.addEventListener("click", () => setNotesOpen(false));
			document.addEventListener("keydown", (event) => {
				if (event.key === "Escape") setNotesOpen(false);
			});

			noteInput.addEventListener("input", () => {
				if (!database || !noteReady) return;
				saveDot.classList.remove("is-saved");
				saveLabel.textContent = "Sparar";
				clearTimeout(saveTimer);
				saveTimer = setTimeout(() => {
					const note = noteInput.value;
					noteWriteQueue = noteWriteQueue
						.then(() => set(ref(database, "notes"), note))
						.then(() => {
							if (noteInput.value === note) {
								saveDot.classList.add("is-saved");
								saveLabel.textContent = "Sparat";
							}
						})
						.catch(() => {
							saveLabel.textContent = "Det gick inte att spara";
						});
				}, 180);
			});

			const configIsSet = Object.values(firebaseConfig).every((value) => !value.startsWith("YOUR_"));
			if (!configIsSet) {
				status.textContent = "Anslut till Firebase för att synkronisera anteckningar och låsa upp foton.";
				saveLabel.textContent = "Inte ansluten";
			} else {
				try {
					const app = initializeApp(firebaseConfig);
					database = getDatabase(app);
					status.textContent = "";

					onValue(ref(database, "notes"), (snapshot) => {
						const value = snapshot.val();
						if (!noteReady) {
							noteInput.value = typeof value === "string" ? value : "";
							noteReady = true;
							saveLabel.textContent = "Sparat";
							saveDot.classList.add("is-saved");
						}
					}, () => {
						status.textContent = "Det gick inte att ansluta till Firebase. Kontrollera projektinställningarna och databasreglerna.";
						saveLabel.textContent = "Frånkopplad";
					});

					onValue(ref(database, "tiles"), (snapshot) => {
						tileStates = snapshot.val() || {};
						const answerTileFlipped = tileStates["2"] === true;
						titleTileUnlocked = tileStates["6"] === true;
						if (!titleTileUnlocked) {
							clearTimeout(titleRestoreTimer);
							pageTitle.textContent = "Martin, at 50";
						}
						crosswordsLink.hidden = tileStates[String(crosswordsTileNumber)] !== true;
						loremLink.hidden = !outerTileNumbers.every((tileNumber) => tileStates[String(tileNumber)] === true);
						answerDragEnabled = !answerTileFlipped;
						answerInput.classList.toggle("is-draggable", answerDragEnabled);
						if (answerTileFlipped) returnAnswerInput();

						renderTileStates();
					}, () => {
						answerDragEnabled = false;
						answerInput.classList.remove("is-draggable");
						returnAnswerInput();
						status.textContent = "Det gick inte att läsa fotonas status. Kontrollera databasreglerna.";
					});

					onValue(ref(database, "tileClues/8"), (snapshot) => {
						tile8ClueShown = snapshot.val() === true;
						renderTileStates();
					}, () => {
						status.textContent = "Det gick inte att läsa ledtrådens status. Kontrollera databasreglerna.";
					});

					onValue(ref(database, "puzzle2Visited"), (snapshot) => {
						puzzle2Link.hidden = snapshot.val() !== true;
					}, () => {
						status.textContent = "Det gick inte att läsa status för pussel 2. Kontrollera databasreglerna.";
					});
				} catch (error) {
					status.textContent = "Firebase-inställningarna behöver ses över. Kontrollera projektinställningarna.";
					saveLabel.textContent = "Inte ansluten";
					console.error(error);
				}
			}
		</script>
	</body>
</html>
