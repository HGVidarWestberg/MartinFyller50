<!doctype html>
<html lang="sv">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#ffffff">
		<title>One Doesn't Belong...</title>
		<link id="dynamic-favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3C/svg%3E">
		<style>
			:root {
				color-scheme: light;
				font-family: Arial, sans-serif;
				color: #202020;
				background: #ffffff;
				--paper: #ffffff;
				--ink: #202020;
				--muted: #777777;
				--line: #e8e8e8;
			}

			* { box-sizing: border-box; }

			body { margin: 0; }

			main {
				width: min(100%, 1040px);
				margin: 0 auto;
				padding: 24px 22px;
			}

			.home-button {
				display: inline-block;
				padding: 9px 12px;
				border: 1px solid #e8e8e8;
				border-radius: 2px;
				color: #202020;
				font-size: 13px;
				text-decoration: none;
				flex-shrink: 0;
			}

			.home-button:hover { background: #f2f2f2; }

			.page-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				padding-bottom: 12px;
				border-bottom: 1px solid #e8e8e8;
			}

			.header-actions {
				display: flex;
				align-items: center;
				gap: 4px;
			}

			.notes-button {
				display: inline-flex;
				align-items: center;
				gap: 9px;
				padding: 10px 13px;
				border: 0;
				border-radius: 3px;
				background: transparent;
				color: var(--ink);
				cursor: pointer;
				font: inherit;
				font-size: 13px;
				transition: background .2s;
			}

			.notes-button:hover { background: #f2f2f2; }
			.notes-button svg { width: 16px; height: 16px; }

			h1 {
				margin: 0;
				font-family: Georgia, serif;
				font-size: 38px;
				font-weight: 400;
			}

			.image-grid {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 16px;
				margin-top: 24px;
			}

			.image-card {
				display: block;
				padding: 0;
				overflow: hidden;
				border: 1px solid #e8e8e8;
				border-radius: 2px;
				background: #f7f7f7;
				cursor: pointer;
			}

			.image-card:hover { border-color: #999999; }

			.image-card:focus-visible {
				outline: 2px solid #202020;
				outline-offset: 3px;
			}

			.image-card img {
				display: block;
				width: 100%;
				aspect-ratio: 1;
				object-fit: cover;
			}

			.status {
				min-height: 1.5em;
				color: #666666;
				font-size: 13px;
			}

			.tile-message {
				margin: 16px 0 0;
				padding: 10px 12px;
				border-left: 3px solid #202020;
				background: #f7f7f7;
				font-weight: 600;
				letter-spacing: .03em;
			}

			.scrim {
				position: fixed;
				z-index: 5;
				inset: 0;
				background: rgba(24, 31, 27, .28);
				opacity: 0;
				pointer-events: none;
				transition: opacity .25s ease;
			}

			.scrim.is-open { opacity: 1; pointer-events: auto; }

			.notes-panel {
				position: fixed;
				z-index: 6;
				top: 0;
				right: 0;
				bottom: 0;
				display: flex;
				width: min(440px, 100%);
				flex-direction: column;
				background: #ffffff;
				box-shadow: -12px 0 40px rgba(27, 34, 29, .12);
				transform: translateX(102%);
				transition: transform .32s cubic-bezier(.2, .75, .25, 1);
			}

			.notes-panel.is-open { transform: translateX(0); }

			.notes-header {
				display: flex;
				min-height: 74px;
				align-items: center;
				justify-content: space-between;
				padding: 0 24px;
				border-bottom: 1px solid var(--line);
			}

			.notes-heading {
				margin: 0;
				font-family: Georgia, serif;
				font-size: 24px;
				font-weight: 500;
			}

			.close-button {
				display: grid;
				width: 34px;
				height: 34px;
				place-items: center;
				border: 0;
				border-radius: 50%;
				background: transparent;
				color: var(--muted);
				cursor: pointer;
			}

			.close-button:hover { background: #f2f2f2; color: var(--ink); }
			.close-button svg { width: 18px; height: 18px; }

			.note-input {
				width: 100%;
				min-height: 0;
				flex: 1;
				resize: none;
				padding: 25px 26px;
				border: 0;
				outline: none;
				background: transparent;
				color: #252a26;
				font: inherit;
				font-size: 15px;
				line-height: 1.8;
			}

			.note-input::placeholder { color: #a2a59e; }

			.notes-footer {
				display: flex;
				min-height: 45px;
				align-items: center;
				justify-content: space-between;
				padding: 0 25px;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 11px;
			}

			.save-state { display: inline-flex; align-items: center; gap: 7px; }
			.save-dot { width: 6px; height: 6px; border-radius: 50%; background: #a3a79f; }
			.save-dot.is-saved { background: #333333; }

			@media (max-width: 600px) {
				main { padding: 18px 14px; }
				h1 { font-size: 32px; }
				.image-grid { gap: 8px; }
				.notes-header { min-height: 66px; padding: 0 20px; }
				.note-input { padding: 21px 20px; }
			}

			@media (prefers-reduced-motion: reduce) {
				*, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
			}
		</style>
	</head>
	<body>
		<main>
			<header class="page-header">
				<h1>En hör inte ihop...</h1>
				<div class="header-actions">
					<button class="notes-button" id="open-notes" type="button" aria-controls="notes-panel" aria-expanded="false">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l4 4v14H4V3h4Z"/><path d="M8 3v5h8V3M8 13h8M8 17h5"/></svg>
						<span>Anteckningar</span>
					</button>
					<a class="home-button" href="index.html">Hem</a>
				</div>
			</header>
			<p class="tile-message" id="fotograf-message" hidden aria-live="polite">V---r ha- -yg-t -n fa-t--t-sk h-ms--a</p>
			<div class="image-grid" id="image-grid"></div>
			<p class="status" id="notes-status" role="status" aria-live="polite"></p>
		</main>

		<div class="scrim" id="scrim"></div>
		<aside class="notes-panel" id="notes-panel" aria-label="Anteckningar" aria-hidden="true">
			<div class="notes-header">
				<h2 class="notes-heading">Anteckningar</h2>
				<button class="close-button" id="close-notes" type="button" aria-label="Stäng anteckningar">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
				</button>
			</div>
			<textarea class="note-input" id="note-input" placeholder="Skriv något…" aria-label="Anteckningstext"></textarea>
			<div class="notes-footer">
				<span>Ren text</span>
				<span class="save-state"><span class="save-dot" id="save-dot"></span><span id="save-label">Ansluter</span></span>
			</div>
		</aside>

		<script src="image-list.js"></script>
		<script type="module">
			import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
			import { getDatabase, onValue, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

			const firebaseConfig = {
				apiKey: "AIzaSyCITRSkY1K9JsP1ALD2ge_LQ2CEHDnGvlc",
				authDomain: "martinfyller50.firebaseapp.com",
				databaseURL: "https://martinfyller50-default-rtdb.europe-west1.firebasedatabase.app",
				projectId: "martinfyller50",
				storageBucket: "martinfyller50.firebasestorage.app",
				messagingSenderId: "117839040642",
				appId: "1:117839040642:web:dba6a65e8a1e54bffce49b",
				measurementId: "G-8SXWMX1464"
			};

			const imageGrid = document.querySelector("#image-grid");
			const fotografMessage = document.querySelector("#fotograf-message");
			const favicon = document.querySelector("#dynamic-favicon");
			const emptyFavicon = favicon.href;
			const notesStatus = document.querySelector("#notes-status");
			const word = "fotograf";
			let martinImages = [];
			let notMartinImages = [];
			let consecutiveCorrectAnswers = 0;

			function pickRandom(images) {
				return images[Math.floor(Math.random() * images.length)];
			}

			function shuffle(images) {
				for (let index = images.length - 1; index > 0; index -= 1) {
					const swapIndex = Math.floor(Math.random() * (index + 1));
					[images[index], images[swapIndex]] = [images[swapIndex], images[index]];
				}
				return images;
			}

			function setFaviconLetter(letter) {
				const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="white"/><text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="#202020">${letter}</text></svg>`;
				favicon.href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
			}

			function waitForFaviconUpdate() {
				return new Promise((resolve) => {
					requestAnimationFrame(() => requestAnimationFrame(resolve));
				});
			}

			function renderImages() {
				notesStatus.textContent = "Laddar bilder…";
				imageGrid.replaceChildren();
				const ownImages = shuffle([...martinImages]);
				const cards = shuffle([
					{ image: pickRandom(notMartinImages), isNotMartin: true },
					{ image: ownImages[0], isNotMartin: false },
					{ image: ownImages[1], isNotMartin: false }
				]);
				const imageSources = cards.map(({ image, isNotMartin }) =>
					`${isNotMartin ? "NotMartinsImages" : "MartinsOwnImages"}/${encodeURIComponent(image)}`
				);
				let imagesLoaded = 0;
				let imageLoadFailed = false;
				const imageButtons = cards.map(({ isNotMartin }, index) => {
					const button = document.createElement("button");
					button.type = "button";
					button.className = "image-card";
					button.setAttribute("aria-label", `Bild ${index + 1}`);
					button.dataset.notMartin = String(isNotMartin);

					const img = document.createElement("img");
					img.src = imageSources[index];
					img.alt = `Bild ${index + 1}`;
					img.addEventListener("load", () => {
						imagesLoaded += 1;
						if (imagesLoaded === cards.length && !imageLoadFailed) {
							notesStatus.textContent = "";
						}
					}, { once: true });
					img.addEventListener("error", () => {
						imageLoadFailed = true;
						notesStatus.textContent = `Det gick inte att läsa bildfilen: ${imageSources[index]}`;
						console.error(`Could not load puzzle image: ${imageSources[index]}`);
					}, { once: true });
					button.append(img);
					button.addEventListener("click", async () => {
						imageGrid.querySelectorAll("button").forEach((imageButton) => {
							imageButton.disabled = true;
						});
						if (button.dataset.notMartin === "true") {
							setFaviconLetter(word[consecutiveCorrectAnswers % word.length]);
							consecutiveCorrectAnswers += 1;
						} else {
							consecutiveCorrectAnswers = 0;
							favicon.href = emptyFavicon;
						}
						await waitForFaviconUpdate();
						renderImages();
					});
					return button;
				});
				imageGrid.replaceChildren(...imageButtons);
			}

			async function loadImages() {
				notesStatus.textContent = "Laddar bilder…";
				try {
					let imageList;
					if (window.location.protocol === "file:") {
						imageList = window.puzzleImageList;
						if (!imageList) throw new Error("Could not load the local puzzle image list");
					} else {
						const response = await fetch("image-list.json");
						if (!response.ok) throw new Error(`Could not load image list: ${response.status}`);
						imageList = await response.json();
					}
					if (!Array.isArray(imageList.martinImages) || !Array.isArray(imageList.notMartinImages)) {
						throw new Error("Image list is missing one or more image folders");
					}
					if (imageList.martinImages.length < 2 || imageList.notMartinImages.length === 0) {
						throw new Error("Image folders do not contain enough images to play");
					}
					martinImages = imageList.martinImages;
					notMartinImages = imageList.notMartinImages;
					renderImages();
				} catch (error) {
					notesStatus.textContent = "Det gick inte att läsa image-list.json. Kontrollera att pussellistan med bilder finns tillgänglig.";
					console.error(error);
				}
			}

			loadImages();

			const noteInput = document.querySelector("#note-input");
			const saveDot = document.querySelector("#save-dot");
			const saveLabel = document.querySelector("#save-label");
			const notesPanel = document.querySelector("#notes-panel");
			const scrim = document.querySelector("#scrim");
			const openButton = document.querySelector("#open-notes");
			const closeButton = document.querySelector("#close-notes");
			const notesUrl = `${firebaseConfig.databaseURL}/notes.json`;
			let noteReady = false;
			let saveTimer;
			let noteWriteQueue = Promise.resolve();

			function setNotesOpen(isOpen) {
				notesPanel.classList.toggle("is-open", isOpen);
				notesPanel.setAttribute("aria-hidden", String(!isOpen));
				scrim.classList.toggle("is-open", isOpen);
				openButton.setAttribute("aria-expanded", String(isOpen));
				if (isOpen) noteInput.focus();
			}

			openButton.addEventListener("click", () => setNotesOpen(true));
			closeButton.addEventListener("click", () => setNotesOpen(false));
			scrim.addEventListener("click", () => setNotesOpen(false));
			document.addEventListener("keydown", (event) => {
				if (event.key === "Escape") setNotesOpen(false);
			});

			noteInput.addEventListener("input", () => {
				if (!noteReady) return;
				saveDot.classList.remove("is-saved");
				saveLabel.textContent = "Sparar";
				clearTimeout(saveTimer);
				saveTimer = setTimeout(() => {
					const note = noteInput.value;
					noteWriteQueue = noteWriteQueue
						.then(async () => {
							const response = await fetch(notesUrl, {
								method: "PUT",
								headers: { "Content-Type": "application/json" },
								body: JSON.stringify(note)
							});
							if (!response.ok) throw new Error(`Notes save failed: ${response.status}`);
						})
						.then(() => {
							if (noteInput.value === note) {
								saveDot.classList.add("is-saved");
								saveLabel.textContent = "Sparat";
							}
						})
						.catch((error) => {
							saveLabel.textContent = "Det gick inte att spara";
							notesStatus.textContent = "Det gick inte att spara anteckningarna. Kontrollera Firebase-inställningarna och databasreglerna.";
							console.error(error);
						});
				}, 180);
			});

			async function loadNotes() {
				try {
					const response = await fetch(notesUrl);
					if (!response.ok) throw new Error(`Notes load failed: ${response.status}`);
					const value = await response.json();
					noteInput.value = typeof value === "string" ? value : "";
					noteReady = true;
					saveDot.classList.add("is-saved");
					saveLabel.textContent = "Sparat";
				} catch (error) {
					saveLabel.textContent = "Frånkopplad";
					notesStatus.textContent = "Det gick inte att läsa in anteckningarna. Kontrollera Firebase-inställningarna och databasreglerna.";
					console.error(error);
				}
			}

			loadNotes();

			try {
				const database = getDatabase(initializeApp(firebaseConfig));
				onValue(ref(database, "tiles/1"), (snapshot) => {
					fotografMessage.hidden = snapshot.val() !== true;
				}, (error) => {
					notesStatus.textContent = "Det gick inte att läsa in fotograf-statusen från Firebase.";
					console.error("Could not load fotograf tile state.", error);
				});
				await set(ref(database, "puzzle2Visited"), true);
			} catch (error) {
				notesStatus.textContent = "Det gick inte att spara att pussel 2 har öppnats. Kontrollera Firebase-inställningarna och databasreglerna.";
				console.error(error);
			}
		</script>
	</body>
</html>
